name: Update Weather

on:
  schedule:
    - cron: '*/15 * * * *'  # runs every 15 minutes
  workflow_dispatch:         # allows manual trigger

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run weather script
        run: python scripts/update_weather.py

      - name: Commit changes
        run: |
          git config user.email "mervin1@uci.edu"
          git config user.name "Mervin Nguyen"
          git add README.md
          git diff --cached --quiet || git commit -m "Update weather"
          git push